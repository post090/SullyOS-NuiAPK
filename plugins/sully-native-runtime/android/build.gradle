ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.sullyos.nativeruntime"
    // Fallback to 34 to match CI workflow's default platform (android-34).
    // When rootProject defines compileSdkVersion (Capacitor >=6 may be 34/35), we follow it.
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

// The UnifiedPush connector pulls the JVM build of Tink; Android apps must use tink-android
// instead, otherwise the app module hits duplicate-class errors.
rootProject.allprojects {
    configurations.configureEach {
        def tinkAndroid = "com.google.crypto.tink:tink-android:1.23.0"
        resolutionStrategy {
            force tinkAndroid
            dependencySubstitution {
                substitute module('com.google.crypto.tink:tink') using module(tinkAndroid)
            }
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'org.unifiedpush.android:connector:3.3.5'
    // 没装 ntfy 时的内置拉取：WorkManager 每 15 分钟去 Worker 的 GET /outbox 拉主动消息。
    // 2.9.x 是 compileSdk 34 能用的最后一系（2.10+ 要 35）。
    implementation 'androidx.work:work-runtime:2.9.0'
    testImplementation "junit:junit:$junitVersion"
}
